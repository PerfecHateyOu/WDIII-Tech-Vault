<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100" fill="none" role="img" aria-label="WDIII Tech Vault Logo (Dark Theme)">
  <!-- Emblem Section -->
  <g id="vault-emblem" transform="translate(12, 2)">
    <!-- Light Silver Shield Base for Dark Theme -->
    <path d="M 45 6 L 83 15 L 83 52 L 45 96 L 7 52 L 7 15 Z" 
          fill="#E6ECF3" />
    
    <!-- Stylized Gold Tech Dot (Bench Notes Mark) -->
    <circle cx="45" cy="22" r="4.2" fill="#E8BD3A" />
    
    <!-- Stylized Geometric 'W' -->
    <path d="M 22 29 L 29 27 L 40 55 L 45 30 L 50 55 L 61 27 L 68 29 L 55 81 L 45 51 L 35 81 Z" 
          fill="#121A26" />
  </g>

  <!-- Typography Section -->
  <!-- Brand Wordmark: Bench Notes Display Typography 'WD' + 'III' -->
  <text x="116" y="58" 
        font-family="'Bricolage Grotesque', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="52" 
        font-weight="800" 
        letter-spacing="-0.02em" 
        fill="#E6ECF3">WD</text>
  <text x="210" y="58" 
        font-family="'Bricolage Grotesque', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="52" 
        font-weight="800" 
        letter-spacing="0.05em" 
        fill="#E8BD3A">III</text>
  
  <!-- Subtitle: TECH VAULT (Bench Notes Teal Win Accent) -->
  <text x="118" y="83" 
        font-family="'Instrument Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="15" 
        font-weight="700" 
        letter-spacing="0.46em" 
        fill="#4FB8A6">TECH VAULT</text>
</svg>
