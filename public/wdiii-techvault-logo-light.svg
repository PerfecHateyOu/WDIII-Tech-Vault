<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100" fill="none" role="img" aria-label="WDIII Tech Vault Logo (Light Theme)">
  <!-- Emblem Section -->
  <g id="vault-emblem" transform="translate(12, 2)">
    <!-- Deep Navy Shield Base for Light Theme -->
    <path d="M 45 6 L 83 15 L 83 52 L 45 96 L 7 52 L 7 15 Z" 
          fill="#08182b" />
    
    <!-- Stylized Sky Blue Tech Dot -->
    <circle cx="45" cy="22" r="4.2" fill="#60a5fa" />
    
    <!-- Stylized Geometric 'W' in Crisp White -->
    <path d="M 22 29 L 29 27 L 40 55 L 45 30 L 50 55 L 61 27 L 68 29 L 55 81 L 45 51 L 35 81 Z" 
        fill="#ffffff" />
  </g>

  <!-- Typography Section -->
  <!-- Brand Wordmark: Modern Sans-Serif 'WD' + Roman Numeral Serifs 'III' -->
  <text x="116" y="58" 
        font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="52" 
        font-weight="700" 
        letter-spacing="0.02em" 
        fill="#08182b">WD</text>
  <text x="206" y="58" 
        font-family="'Times New Roman', 'Cinzel', 'Baskerville', Georgia, serif" 
        font-size="52" 
        font-weight="700" 
        letter-spacing="0.08em" 
        fill="#08182b">III</text>
  
  <!-- Subtitle: TECH VAULT (Wide Tracked) -->
  <text x="118" y="83" 
        font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="0.48em" 
        fill="#2563eb">TECH VAULT</text>
</svg>
