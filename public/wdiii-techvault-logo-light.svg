<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100" fill="none" role="img" aria-label="WDIII Tech Vault Logo (Light Theme)">
  <!-- Emblem Section (Shield + Stylized W + Tech Dot) -->
  <g id="vault-emblem" transform="translate(14, 0)">
    <!-- Dark Navy Shield Base for Light Theme -->
    <path d="M 45 6 L 85 15 L 85 52 L 45 96 L 5 52 L 5 15 Z" 
          fill="#08182b" />
    
    <!-- Light Blue Tech Dot -->
    <circle cx="45" cy="24" r="4.2" fill="#60a5fa" />
    
    <!-- Stylized Geometric 'W' in Crisp White -->
    <path d="M 24 31 L 30 28 L 39 56 L 45 33 L 51 56 L 60 28 L 66 31 L 53 82 L 45 54 L 37 82 Z" 
          fill="#ffffff" />
  </g>

  <!-- Typography Section -->
  <!-- Brand Wordmark: WDIII -->
  <text x="126" y="58" 
        font-family="'Cinzel', 'Times New Roman', 'Baskerville', 'Playfair Display', Georgia, serif" 
        font-size="52" 
        font-weight="700" 
        letter-spacing="0.04em" 
        fill="#08182b">WDIII</text>
  
  <!-- Subtitle: TECH VAULT (Wide Tracked) -->
  <text x="128" y="83" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="0.45em" 
        fill="#2563eb">TECH VAULT</text>
</svg>
