<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100" fill="none" role="img" aria-label="Fodder Archive Logo">
  <!-- Fodder Archive Shield Emblem (Dark Theme) -->
  <g id="shield-emblem">
    <!-- Outer Shield Crest -->
    <path d="M 55 8 L 93 18 L 93 54 C 93 74 73 89 55 94 C 37 89 17 74 17 54 L 17 18 Z" 
          stroke="#E6ECF3" 
          stroke-width="5" 
          stroke-linejoin="round" 
          stroke-linecap="round" 
          fill="none" />
    
    <!-- Top Drawer: Bench Notes Teal Win Accent -->
    <rect x="27" y="24" width="56" height="14" rx="2.5" fill="#4FB8A6" />
    <rect x="47" y="29.5" width="16" height="2.8" rx="1.4" fill="#121A26" />
    
    <!-- Middle Drawer: Crisp Light Silver -->
    <rect x="27" y="43" width="56" height="14" rx="2.5" fill="#E6ECF3" />
    <rect x="47" y="48.5" width="16" height="2.8" rx="1.4" fill="#121A26" />
    
    <!-- Bottom Drawer: Warm Gold Mark -->
    <rect x="35" y="62" width="40" height="13" rx="2.5" fill="#E8BD3A" />
    <rect x="49" y="67" width="12" height="2.6" rx="1.3" fill="#121A26" />
  </g>

  <!-- Typography -->
  <!-- Wordmark: FODDER (Bricolage Grotesque) -->
  <text x="126" y="58" 
        font-family="'Bricolage Grotesque', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="48" 
        font-weight="800" 
        letter-spacing="-0.01em" 
        fill="#E6ECF3">FODDER</text>
  
  <!-- Subtitle: ARCHIVE (Instrument Sans) -->
  <text x="128" y="83" 
        font-family="'Instrument Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="15" 
        font-weight="700" 
        letter-spacing="0.44em" 
        fill="#4FB8A6">ARCHIVE</text>
</svg>
